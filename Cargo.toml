[package]
name = "cleverest"
version = "0.1.0"
edition = "2021"
description = "A simple desktop screencast application with client and server components"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
# CLI arguments
clap = { version = "4.4", features = ["derive"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Async runtime
tokio = { version = "1.36", features = ["full"] }
# Screen capture
screenshots = "0.8.5"
# Image processing
image = "0.24"
# Network communication
quinn = "0.10"
rustls = { version = "0.21", features = ["dangerous_configuration", "quic"] }
# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
# Display (for server)
minifb = "0.25"
# Logging
env_logger = "0.10"
log = "0.4"
# UUID generation
uuid = { version = "1.6", features = ["v4"] }
# Certificate generation
rcgen = "0.11"

[features]
default = []
client = []
server = []

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]
